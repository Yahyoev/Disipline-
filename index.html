<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Discipline">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Discipline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iPhone-style frame centred on desktop (status bar + island), full screen on a phone; iOS grouped lists, large titles, translucent tab bar */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --fill:rgba(118,118,128,.12); --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --tint:#0E7A62; --tint-soft:rgba(14,122,98,.12); --on-tint:#FFFFFF;
  --gold:#C08A1E; --gold-soft:rgba(192,138,30,.13); --green:#34C759; --red:#FF3B30; --income:#248A3D; --expense:#D70015;
  --bar:rgba(249,249,249,.86); --stage:#D9DDE3; --frame:#1D1D1F; --thumb:#FFFFFF; --scrim:rgba(0,0,0,.35);
  --c-work:#007AFF; --c-study:#AF52DE; --c-personal:#0E7A62; --c-other:#A2845E;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  --f-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --tint:#30D1A4; --tint-soft:rgba(48,209,164,.16); --on-tint:#00261C;
  --gold:#FFC24B; --gold-soft:rgba(255,194,75,.15); --green:#30D158; --red:#FF453A; --income:#30D158; --expense:#FF6961;
  --bar:rgba(22,22,24,.84); --stage:#2A2C30; --frame:#0B0B0C; --thumb:#636366; --scrim:rgba(0,0,0,.55);
  --c-work:#0A84FF; --c-study:#BF5AF2; --c-personal:#30D1A4; --c-other:#AC8E68; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --tint:#30D1A4; --tint-soft:rgba(48,209,164,.16); --on-tint:#00261C;
  --gold:#FFC24B; --gold-soft:rgba(255,194,75,.15); --green:#30D158; --red:#FF453A; --income:#30D158; --expense:#FF6961;
  --bar:rgba(22,22,24,.84); --stage:#2A2C30; --frame:#0B0B0C; --thumb:#636366; --scrim:rgba(0,0,0,.55);
  --c-work:#0A84FF; --c-study:#BF5AF2; --c-personal:#30D1A4; --c-other:#AC8E68; color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--label);font-family:var(--f);font-size:17px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.note{max-width:400px;text-align:center;color:var(--label2);font-size:13px;line-height:1.45;margin:0}
.device{width:100%;max-width:404px;height:min(852px,calc(100% - 48px));min-height:600px;padding:11px;border-radius:58px;background:var(--frame);box-shadow:0 40px 80px -30px rgba(0,0,0,.55)}
.phone{position:relative;height:100%;background:var(--bg);border-radius:48px;overflow:hidden;display:flex;flex-direction:column}
.status{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px;position:relative;z-index:8;background:var(--bg)}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.status .sys{display:flex;gap:6px;align-items:center}
@media (max-width:480px){
  body{padding:0;gap:0}
  .note{display:none}
  .device{max-width:none;height:100%;min-height:0;padding:0;border-radius:0;background:none;box-shadow:none}
  .phone{border-radius:0}
  .status{display:none}
}
.screen{flex:1;overflow-y:auto;padding:0 16px 120px;display:none;scrollbar-width:none}
.screen.on{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
.navbar{display:flex;justify-content:flex-end;align-items:center;gap:18px;min-height:44px;padding-top:4px}
.navbar .link{color:var(--tint);font-size:17px}
.navbar .icon-btn{color:var(--tint);display:grid;place-items:center;width:32px;height:32px}
.lt{font-family:var(--f-d);font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin:2px 4px 2px;text-wrap:balance}
.sub{color:var(--label2);font-size:15px;margin:0 4px 12px}
/* calendar week */
.week{display:grid;grid-template-columns:repeat(7,1fr);background:var(--cell);border-radius:12px;padding:8px 4px 6px;margin-bottom:6px}
.wkhead{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 8px;color:var(--label2);font-size:13px;text-transform:uppercase;letter-spacing:.02em}
.wkhead button{color:var(--tint);font-size:22px;width:32px;height:28px;display:grid;place-items:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
.day small{font-size:11px;font-weight:600;color:var(--label2)}
.day b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:400}
.day.today b{color:var(--red);font-weight:600}
.day.sel b{background:var(--label);color:var(--bg);font-weight:600}
.day.sel.today b{background:var(--red);color:#fff}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.has i{background:var(--label3)}
/* grouped list */
.hdr{font-size:13px;color:var(--label2);text-transform:uppercase;margin:24px 16px 7px;letter-spacing:.01em}
.hdr.big{font-family:var(--f-d);text-transform:none;font-size:22px;font-weight:700;color:var(--label);margin:24px 4px 8px;letter-spacing:.01em}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 0 0 16px;position:relative;width:100%;text-align:left}
.cell .main{flex:1;min-width:0;padding:11px 16px 11px 0;display:flex;align-items:center;gap:10px;border-bottom:.5px solid var(--sep)}
.group>.cell:last-child .main,.group>*:last-child .main{border-bottom:0}
.cell .txt{flex:1;min-width:0}
.cell .t{line-height:1.25}
.cell .m{font-size:15px;color:var(--label2);margin-top:2px;line-height:1.3}
.cell .val{color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cell .chev{color:var(--label3);flex:none}
.cell:active{background:var(--fill)}
.ic{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
/* reminder-style check */
.rc{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--label3);display:grid;place-items:center;flex:none;transition:all .15s}
.rc.on{background:var(--cat);border-color:var(--cat);color:#fff}
.task .t.done{color:var(--label2)}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.time{width:46px;flex:none;font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;padding-top:1px}
.pr .t{color:var(--gold);font-weight:600}
.pr.past .t{color:var(--label2);font-weight:400}
.free .t{color:var(--tint);font-weight:600}
.pill-btn{background:var(--tint-soft);color:var(--tint);font-size:15px;font-weight:600;border-radius:999px;padding:6px 12px;white-space:nowrap}
/* widgets */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wg{background:var(--cell);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.wg .top{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase}
.wg .num{font-family:var(--f-d);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg .cap{font-size:13px;color:var(--label2)}
.wg.prayer{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.wg.prayer .ic{background:var(--gold);width:40px;height:40px;border-radius:10px}
.wg.prayer .mid{flex:1;min-width:0}
.wg.prayer .left{color:var(--gold);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{border-radius:7px;padding:6px 8px;font-size:13px;font-weight:500}
.seg button.on{background:var(--thumb);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.scroll-chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 4px;padding:0 16px;scrollbar-width:none}
.scroll-chips::-webkit-scrollbar{display:none}
.chip{background:var(--cell);border-radius:999px;padding:7px 14px;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--label);color:var(--bg);font-weight:600}
/* money */
.money-card{background:var(--cell);border-radius:16px;padding:16px}
.money-card small{color:var(--label2);font-size:13px;font-weight:600;text-transform:uppercase}
.money-card .big{font-family:var(--f-d);font-size:34px;font-weight:700;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.money-card .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:.5px solid var(--sep);padding-top:12px}
.money-card .two b{font-size:17px;font-variant-numeric:tabular-nums}
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 2px}
.empty{text-align:center;color:var(--label2);padding:40px 24px;line-height:1.45;font-size:15px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.mnav button{color:var(--tint);font-size:24px;width:36px;height:32px}
.mnav span{font-weight:600}
/* switch */
.sw{width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
/* tab bar */
nav.tabs{position:absolute;left:12px;right:12px;bottom:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
  border:.5px solid var(--glass-line);border-radius:32px;padding:5px;box-shadow:0 12px 32px -12px rgba(0,0,0,.35),inset 0 1px 0 var(--glass-hi);z-index:6}
@media (max-width:480px){nav.tabs{bottom:calc(10px + env(safe-area-inset-bottom,0px))}}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:600;color:var(--label2);letter-spacing:.01em;border-radius:26px;padding:6px 0 5px;transition:background .25s,color .25s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--tint);background:var(--tint-soft)}
/* sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;z-index:21;background:var(--bg);border-radius:12px 12px 0 0;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:0 16px 30px}
@media (max-width:480px){.sheet{top:calc(12px + env(safe-area-inset-top,0px))}}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 4px}
.sheet-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:10px}
.sheet-nav .l{color:var(--tint);justify-self:start}
.sheet-nav .r{color:var(--tint);font-weight:600;justify-self:end}
.sheet-nav h2{font-size:17px;font-weight:600;margin:0}
.in{flex:1;min-width:0;border:0;background:none;padding:11px 16px 11px 0;outline:none;font-size:17px}
.in::placeholder{color:var(--label3)}
.cell input[type=date],.cell input[type=time],.cell select{border:0;background:var(--fill);border-radius:7px;padding:5px 10px;font-size:17px;color:var(--label);outline:none}
.amt{font-family:var(--f-d);font-size:34px;font-weight:700;text-align:center;width:100%;border:0;background:none;outline:none;padding:12px 0;font-variant-numeric:tabular-nums}
.danger{color:var(--red);text-align:center;width:100%;padding:12px;font-size:17px}
.err{color:var(--red);font-size:13px;margin:6px 16px 0;min-height:16px}
.demo{font-size:11px;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px}
/* habits */
.habits{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.habits::-webkit-scrollbar{display:none}
.hab{flex:none;width:132px;background:var(--cell);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left}
.hab .hd{display:flex;justify-content:space-between;align-items:center}
.hab .t{font-size:15px;font-weight:600;line-height:1.25;min-height:38px}
.hab .st{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums}
.hab .st b{color:#FF9500}
.hbtn{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--label3);display:grid;place-items:center;color:#fff}
.hbtn.on{background:var(--hc);border-color:var(--hc)}
.hab.add{align-items:center;justify-content:center;color:var(--tint);font-weight:600;font-size:15px;border:1.5px dashed var(--label3);background:none}
/* avatar */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;flex:none;letter-spacing:0}
.av.big{width:84px;height:84px;font-size:34px;margin:4px auto 10px}
.center{text-align:center}
.name{font-family:var(--f-d);font-size:26px;font-weight:700;margin:0}
.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.btnrow>*{background:var(--cell);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--tint);font-size:12px;font-weight:500;text-decoration:none}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cell);border-radius:12px;padding:12px 4px}
.stats3>div{text-align:center;border-left:.5px solid var(--sep)}
.stats3>div:first-child{border-left:0}
.stats3 b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats3 small{font-size:12px;color:var(--label2)}
/* progress */
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:3px}
/* prayer week dots */
.pweek{display:grid;grid-template-columns:62px repeat(7,1fr);gap:6px 4px;align-items:center;background:var(--cell);border-radius:12px;padding:12px}
.pweek .h{font-size:11px;font-weight:600;color:var(--label2);text-align:center}
.pweek .l{font-size:13px;color:var(--label2)}
.pweek .d{width:16px;height:16px;border-radius:50%;margin:0 auto;background:var(--fill)}
.pweek .d.on{background:var(--gold)}
.pweek .d.fut{background:none;border:1.5px dashed var(--fill)}
/* summary tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--cell);border-radius:16px;padding:14px}
.tile small{display:block;font-size:13px;color:var(--label2);font-weight:600}
.tile b{display:block;font-family:var(--f-d);font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--label2)}
/* focus */
.focus{display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 0}
.focus .ttl{font-size:15px;color:var(--label2);text-align:center;max-width:280px}
.ringwrap{position:relative;width:240px;height:240px;max-width:100%}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-d);font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fbtns{display:flex;gap:28px}
.fbtns button{width:78px;height:78px;border-radius:50%;font-size:15px;font-weight:500}
.fbtns .stop{background:var(--fill)}
.fbtns .go{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.fbtns .go.pause{background:color-mix(in srgb,#FF9500 22%,transparent);color:#FF9500}
/* widget mock */
.homebg{border-radius:16px;padding:18px;background:linear-gradient(160deg,#1F5B4D,#0C2E27 60%,#2B2140)}
.wmock{width:170px;height:170px;border-radius:24px;background:rgba(255,255,255,.92);color:#000;padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.wmock .lbl{font-size:11px;font-weight:700;color:#C08A1E;text-transform:uppercase;letter-spacing:.02em}
.wmock .big{font-size:22px;font-weight:700;line-height:1.1}
.wmock .sm{font-size:12px;color:rgba(60,60,67,.7);line-height:1.3}
.wmock .nt{border-top:.5px solid rgba(60,60,67,.2);padding-top:8px}
.homegrid{display:flex;gap:18px;align-items:flex-start}
.apps{display:grid;grid-template-columns:repeat(2,52px);gap:18px 16px}
.apps i{display:block;width:52px;height:52px;border-radius:13px;background:rgba(255,255,255,.18)}
textarea.bk{width:100%;min-height:120px;border:0;border-radius:12px;background:var(--cell);padding:12px;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--label);resize:vertical}
.ok{color:var(--green);font-size:13px;margin:6px 16px;min-height:16px}
.banner{display:flex;align-items:center;gap:12px;background:var(--cell);border-radius:12px;padding:12px 14px;margin-top:12px;width:100%;text-align:left}
.banner .txt{flex:1;min-width:0}
.banner small{display:block;color:var(--label2);font-size:13px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;margin-bottom:12px;color:var(--label2)}
.search input{flex:1;border:0;background:none;outline:none;padding:9px 0;font-size:17px;color:var(--label)}
/* ── v4: glass, rings, sky card, wallet */
:root{--glass:rgba(255,255,255,.72);--glass-line:rgba(0,0,0,.08);--glass-hi:rgba(255,255,255,.9);--ring1:#0E9C7A;--ring2:#E3A21A;--ring3:#FF7A1A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(40,40,44,.62);--glass-line:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.08);--ring1:#36E0B0;--ring2:#FFC94D;--ring3:#FF8A3D}}
:root[data-theme="dark"]{--glass:rgba(40,40,44,.62);--glass-line:rgba(255,255,255,.12);--glass-hi:rgba(255,255,255,.08);--ring1:#36E0B0;--ring2:#FFC94D;--ring3:#FF8A3D}
.sky{position:relative;overflow:hidden;width:100%;text-align:left;border-radius:22px;padding:18px 18px 16px;color:#fff;margin-top:12px;isolation:isolate}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 85% 0%,rgba(255,255,255,.28),transparent 55%);z-index:-1}
.sky .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sky small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.sky .pname{font-family:var(--f-d);font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.sky .ptime{font-family:var(--f-d);font-size:44px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sky .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:16px 0 8px;overflow:hidden}
.sky .bar i{display:block;height:100%;background:#fff;border-radius:3px}
.sky .row2{display:flex;justify-content:space-between;font-size:13px;font-weight:500;opacity:.92}
.sky .stars{position:absolute;inset:0;z-index:-1;background-image:radial-gradient(1.2px 1.2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.4px 1.4px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 55% 40%,#fff,transparent);opacity:.7}
.rings-card{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;background:var(--cell);border-radius:22px;padding:16px;margin-top:12px}
.rings-card svg{width:132px;height:132px;transform:rotate(-90deg)}
.rings-card circle{fill:none;stroke-linecap:round}
.rings-card.anim .arc{animation:ring 1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ring{from{stroke-dashoffset:var(--full)}}
.legend{display:flex;flex-direction:column;gap:9px;min-width:0}
.legend div{display:flex;flex-direction:column}
.legend small{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.legend b{font-family:var(--f-d);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.legend b span{font-size:15px;color:var(--label2);font-weight:500}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.mini{background:var(--cell);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center;min-width:0}
.mini .ic{width:34px;height:34px;border-radius:10px}
.mini small{display:block;font-size:12px;color:var(--label2);font-weight:600}
.mini b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hab{background:color-mix(in srgb,var(--hc) 13%,var(--cell));border-radius:20px}
.hab .dots7{display:flex;gap:4px}
.hab .dots7 i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--hc) 22%,transparent)}
.hab .dots7 i.on{background:var(--hc)}
.wallet{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;isolation:isolate;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 50%),radial-gradient(90% 70% at 0% 100%,rgba(70,210,170,.35),transparent 60%),linear-gradient(135deg,#0E7A62,#0A4C3F 55%,#16324A)}
.wallet small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.wallet .big{font-family:var(--f-d);font-size:38px;font-weight:700;margin:2px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wallet .spark{display:flex;align-items:flex-end;gap:2px;height:44px;margin:10px 0 14px}
.wallet .spark i{flex:1;background:rgba(255,255,255,.28);border-radius:2px 2px 0 0;min-height:2px}
.wallet .spark i.hi{background:#fff}
.wallet .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:.5px solid rgba(255,255,255,.25);padding-top:12px}
.wallet .two small{display:flex;gap:4px;align-items:center;opacity:.85}
.wallet .two b{font-size:18px;font-variant-numeric:tabular-nums}
.lt{background:linear-gradient(90deg,var(--label),color-mix(in srgb,var(--label) 70%,var(--tint)));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>

const FIVE=['fajr','dhuhr','asr','maghrib','isha'];
const rad=Math.PI/180,sin=x=>Math.sin(x*rad),cos=x=>Math.cos(x*rad),tan=x=>Math.tan(x*rad);
const asin=x=>Math.asin(x)/rad,acos=x=>Math.acos(x)/rad,atan2=(y,x)=>Math.atan2(y,x)/rad,acot=x=>Math.atan(1/x)/rad;
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a;};
function julian(y,m,d){if(m<=2){y-=1;m+=12;}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D;
  const RA=atan2(cos(e)*sin(L),cos(L))/15;return{decl:asin(sin(e)*sin(L)),eqt:q/15-fix(RA,24)};}
const ptCache={};
function prayerTimes(day){
  const ck=key(day);if(ptCache[ck])return ptCache[ck];
  const lat=PLACE.lat,lng=PLACE.lng,jd=julian(day.getFullYear(),day.getMonth()+1,day.getDate())-lng/(15*24);
  const tz=-new Date(day.getFullYear(),day.getMonth(),day.getDate(),12).getTimezoneOffset()/60;
  const noon=t=>fix(12-sunPos(jd+t).eqt,24);
  const ang=(a,t,ccw)=>{const dc=sunPos(jd+t).decl,T=acos((-sin(a)-sin(dc)*sin(lat))/(cos(dc)*cos(lat)))/15;return noon(t)+(ccw?-T:T);};
  const asr=t=>{const dc=sunPos(jd+t).decl;return ang(-acot(2+tan(Math.abs(lat-dc))),t);};
  let f=ang(18,5/24,1),sr=ang(0.833,6/24,1),dh=noon(12/24),as=asr(13/24),ss=ang(0.833,18/24),is=ang(17,18/24);
  const portion=(24-(ss-sr))/7;
  if(isNaN(f)||sr-f>portion)f=sr-portion;
  if(isNaN(is)||is-ss>portion)is=ss+portion;
  const toDate=h=>new Date(day.getFullYear(),day.getMonth(),day.getDate(),0,Math.round((h+tz-lng/15)*60));
  return ptCache[ck]=[f,sr,dh,as,ss,is].map((h,i)=>({k:PK[i][0],label:PK[i][1],time:toDate(h),prayer:i!==1}));
}

// ───────── расчёты
const DAY_START=7*60,DAY_END=23*60,PRAYER_BLOCK=20;
function freeSlots(day,tasks,prayers){
  let ws=new Date(day.getFullYear(),day.getMonth(),day.getDate(),0,DAY_START);const we=new Date(day.getFullYear(),day.getMonth(),day.getDate(),0,DAY_END);
  const now=new Date();if(now>=we)return[];
  if(now>ws)ws=new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours(),now.getMinutes()+((5-now.getMinutes()%5)%5));
  const busy=[];
  tasks.forEach(t=>{if(t.start!=null){const s=new Date(day.getFullYear(),day.getMonth(),day.getDate(),0,t.start);busy.push([s,new Date(s.getTime()+t.dur*6e4)]);}});
  prayers.forEach(p=>{if(p.prayer)busy.push([p.time,new Date(p.time.getTime()+PRAYER_BLOCK*6e4)]);});
  busy.sort((a,b)=>a[0]-b[0]);
  const out=[];let c=ws;
  for(const[b0,b1]of busy){if(b1<=c)continue;if(b0>c){const e=b0<we?b0:we;if((e-c)/6e4>=30)out.push([c,e]);}if(b1>c)c=b1;if(c>=we)break;}
  if((we-c)/6e4>=30)out.push([c,we]);
  return out;
}
function streak(h){const set=new Set(h.log);let d=today();if(!set.has(key(d)))d=addDays(d,-1);let n=0;while(set.has(key(d))){n++;d=addDays(d,-1);}return n;}
function clientStats(c){

  const earned=S.txns.filter(x=>x.clientId===c.id&&x.type==='income').reduce((a,x)=>a+x.amount,0);
  const owes=S.debts.filter(d=>d.clientId===c.id&&!d.paid).reduce((a,d)=>a+d.amount,0);
  return{orders,earned,owes};
}
function weekSummary(){
  const end=today(),start=addDays(end,-6),inRange=k=>{const d=fromKey(k);return d>=start&&d<=end;};
  const tasks=S.tasks.filter(t=>inRange(t.date));

  return{start,end,done,total:tasks.length,studyMin,inc,exp,prayed,possible,hDone,hAll};
}

    $('s-1').innerHTML=nb+(cells?`<div class="group">${cells}</div>`:'<div class="empty">Целей пока нет</div>')+`<div class="group" style="margin-top:16px"><button class="cell" data-act="newgoal"><span class="main" style="color:var(--tint)">${I('plus',20,2)} Новая цель</span></button></div><div class="hdr" style="text-transform:none">Учебные задачи можно привязать к цели — тогда их видно в прогрессе</div>`;
    return;
  }
  const showDone=taskView==='done',t0=today();
  let list=S.tasks.filter(t=>t.done===showDone&&(!filter||t.cat===filter));
  list.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.start??-1)-(b.start??-1));

  list.forEach(t=>{const d=fromKey(t.date),g=!showDone&&d<t0?'Просрочено':dayTitle(d);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(t);});

   ${html||`<div class="empty">${showDone?'Выполненных задач пока нет':'Все задачи сделаны.<br>Добавь новую — например, что выучить на этой неделе.'}</div>`}`;
}

  $('s-3').innerHTML=`<div class="navbar">${navBtn('add','plus','Добавить запись')}</div><div class="lt" style="margin-bottom:10px">Деньги</div>
   <div class="mnav"><button data-act="mon" data-d="-1" aria-label="Прошлый месяц">‹</button><span>${MN[fm]} ${fy}</span><button data-act="mon" data-d="1" aria-label="Следующий месяц">›</button></div>
   <div class="wallet"><small>Итог · ${MN[fm]}</small><div class="big">${money(inc-exp)}</div>
   <div class="spark" aria-hidden="true">${spark}</div>
   <div class="two"><div><small>${I('up',14,2.4)}Доход</small><b>${money(inc)}</b></div><div><small>${I('down',14,2.4)}Расход</small><b>${money(exp)}</b></div></div></div>
   <div class="hdr">Мне должны${owed?' · '+money(owed):''}</div>
   <div class="group">${open.map(d=>{const c=client(d.clientId),late=fromKey(d.due)<today();return `<button class="cell" data-act="debt" data-id="${d.id}">${c?avatar(c):icon('user','#8E8E93')}<span class="main"><span class="txt"><div class="t">${esc(c?c.name:'Клиент')}</div><div class="m" style="${late?'color:var(--red)':''}">${late?'Просрочено · ':'До '}${dayMonth(fromKey(d.due))}${d.note?' · '+esc(d.note):''}</div></span><span class="val" style="color:var(--label);font-weight:600">${money(d.amount)}</span></span></button>`;}).join('')}

let timer=null;
function stopTimer(){if(timer){clearInterval(timer.iv);timer=null;}}
function focusSheet(t){
  const total=25*60;let left=total,running=true,startedAt=Date.now(),spent=0;
  openSheet(`${nav('Фокус','', 'Закрыть')}
   <div class="focus"><div class="ttl">${esc(t.title)}</div>
   <div class="ringwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--fill)" stroke-width="7"/><circle id="f-ring" cx="60" cy="60" r="54" fill="none" stroke="#FF9500" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg><div class="clock" id="f-clock">25:00</div></div>
   <div class="fbtns"><button class="stop" data-act="fstop">Готово</button><button class="go pause" id="f-go" data-act="fgo">Пауза</button></div>
   <div class="sub center" style="max-width:280px">Телефон в режиме «Не беспокоить». Через 25 минут — перерыв 5 минут.</div></div>`);
  const tick=()=>{if(!timer)return;if(timer.running){const now=Date.now();timer.spent+= (now-timer.last)/1000;timer.last=now;}
    const l=Math.max(0,total-timer.spent);$('f-clock').textContent=two(Math.floor(l/60))+':'+two(Math.floor(l%60));
    $('f-ring').setAttribute('stroke-dashoffset',(339.3*(1-l/total)).toFixed(1));
    if(l<=0){finishFocus();}};
  timer={iv:setInterval(tick,250),running:true,last:Date.now(),spent:0,task:t};
}
function finishFocus(){
  if(!timer)return;const t=timer.task,mins=Math.max(1,Math.round(timer.spent/60));stopTimer();
  const k=tKey();S.focus[k]=(S.focus[k]||0)+mins;
  const g=t.goalId?S.goals.find(x=>x.id===t.goalId):null;if(g&&g.unit==='часов')g.progress=Math.round((g.progress+mins/60)*10)/10;
  save();
  openSheet(`${nav('Фокус','', 'Закрыть')}<div class="focus"><div style="font-size:56px">✅</div><div class="name">${dur(mins)} учёбы</div><div class="sub center">Засчитано в итог недели${g&&g.unit==='часов'?' и в цель «'+esc(g.title)+'»':''}.</div>
   ${t.done?'':`<button class="chip" style="padding:12px 20px;background:var(--tint);color:var(--on-tint);font-weight:600" data-act="focusdone" data-id="${t.id}">Отметить задачу выполненной</button>`}</div>`);
}

const num=v=>parseFloat(String(v).replace(/[\s₽]/g,'').replace(',','.'));
function err(t){const e=$('f-err');if(e)e.textContent=t;}

$('app').addEventListener('click',e=>{
  if(e.target.id==='scrim'){closeSheet();render();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=Number(b.dataset.id);
  switch(a){
    case'tab':tab=Number(b.dataset.t);animRings=tab===0;closeSheet();$('s-'+tab).scrollTop=0;break;
    case'add':if(tab===3)txnForm();else taskForm(null,{date:tab===0?day:today()});return;
    case'close':closeSheet();break;
    case'summary':summarySheet();return;
    case'settings':settingsSheet();return;
    case'day':day=fromKey(b.dataset.k);animRings=true;break;
    case'wk':day=addDays(day,Number(b.dataset.d));animRings=true;break;
    case'today':day=today();animRings=true;break;
    case'toggle':{const t=S.tasks.find(x=>x.id===id);if(!t)break;t.done=!t.done;save();
      if(t.done&&t.cat==='work'&&!S.txns.some(x=>x.taskId===t.id)){render();paidForm(t);return;}
      if(t.done&&t.goalId){const g=S.goals.find(x=>x.id===t.goalId);if(g&&g.unit==='уроков'){g.progress++;save();}}
      break;}
    case'edit':taskForm(S.tasks.find(x=>x.id===id));return;
    case'study':taskForm(null,{cat:'study',date:day,start:Number(b.dataset.s),dur:Math.min(60,Math.max(15,Math.floor(Number(b.dataset.m)/15)*15))});return;
    case'tview':taskView=b.dataset.v;break;
    case'filter':filter=b.dataset.v||null;break;
    case'mon':{const d=new Date(fy,fm+Number(b.dataset.d),1);fy=d.getFullYear();fm=d.getMonth();break;}
    case'etxn':txnForm(S.txns.find(x=>x.id===id));return;
    case'pd':pday=addDays(pday,Number(b.dataset.d));break;
    case'bell':S.notify[b.dataset.k]=S.notify[b.dataset.k]?0:1;save();break;
    case'pray':{const k=key(pday);S.prayed[k]=S.prayed[k]||{};S.prayed[k][b.dataset.k]=S.prayed[k][b.dataset.k]?0:1;save();break;}
    case'habit':{const h=S.habits.find(x=>x.id===id),k=key(day);if(h){h.log=h.log.includes(k)?h.log.filter(x=>x!==k):h.log.concat(k);save();}break;}
    case'ehabit':habitForm(S.habits.find(x=>x.id===id));return;
    case'newhabit':habitForm();return;
    case'hcolor':form.color=b.dataset.v;form.drawC();return;
    case'goal':goalForm(S.goals.find(x=>x.id===id));return;
    case'newgoal':goalForm();return;
    case'gprog':{const g=S.goals.find(x=>x.id===form.id);if(g){g.progress=Math.max(0,Math.round((g.progress+Number(b.dataset.v))*10)/10);save();goalForm(g);}return;}
    case'client':clientCard(client(id));return;
    case'newclient':clientForm();return;
    case'editclient':clientForm(client(id));return;
    case'neworder':taskForm(null,{cat:'work',clientId:id,date:today()});return;
    case'copyphone':{const v=b.dataset.v;const done=()=>{const o=$('f-ok');if(o)o.textContent='Номер '+v+' скопирован. В приложении кнопка сразу откроет звонок.';};
      try{navigator.clipboard.writeText(v).then(done,done);}catch(_){done();}return;}
    case'debt':debtForm(S.debts.find(x=>x.id===id));return;
    case'newdebt':debtForm();return;
    case'debtpaid':{const d=S.debts.find(x=>x.id===form.id);if(d){d.paid=true;S.txns.push({id:nid(),type:'income',amount:d.amount,cat:'Возврат долга',note:d.note,date:tKey(),clientId:d.clientId});save();}closeSheet();break;}
    case'focus':focusSheet(S.tasks.find(x=>x.id===id));return;
    case'fgo':if(timer){timer.running=!timer.running;timer.last=Date.now();b.textContent=timer.running?'Пауза':'Дальше';b.classList.toggle('pause',timer.running);}return;
    case'fstop':finishFocus();return;
    case'focusdone':{const t=S.tasks.find(x=>x.id===id);if(t){t.done=true;save();}closeSheet();break;}
    case'pmode':form.mode=b.dataset.v;document.querySelectorAll('#f-mode button').forEach(x=>x.classList.toggle('on',x.dataset.v===form.mode));$('f-duewrap').hidden=form.mode!=='debt';return;
    case'savepaid':{const t=S.tasks.find(x=>x.id===form.taskId),amt=num($('f-amt').value);if(!(amt>0)){err('Введи сумму или нажми «Пропустить»');return;}
      const cid=t.clientId||(Number(($('f-pclient')||{}).value)||null);if(!t.clientId&&cid)t.clientId=cid;
      if(form.mode==='paid')S.txns.push({id:nid(),type:'income',amount:amt,cat:'Заказ',note:t.title,date:tKey(),clientId:cid,taskId:t.id});
      else S.debts.push({id:nid(),clientId:cid,amount:amt,due:$('f-due').value||key(addDays(today(),3)),note:t.title,paid:false});
      save();closeSheet();break;}
    case'fcat':form.cat=b.dataset.v;document.querySelectorAll('#f-cats .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===form.cat));return;
    case'tcat':form.cat=b.dataset.v;form.draw();return;
    case'ttype':form.type=b.dataset.v;form.draw();return;
    case'savetask':{const title=$('f-title').value.trim();if(!title){err('Напиши, что нужно сделать');$('f-title').focus();return;}
      const tv=$('f-time').value,start=tv?Number(tv.slice(0,2))*60+Number(tv.slice(3,5)):null,rv=$('f-rem').value;
      const data={title,cat:form.cat,date:$('f-date').value||key(day),start,dur:Number($('f-dur').value),remind:start==null||rv===''?null:Number(rv),clientId:Number($('f-client').value)||null,goalId:Number($('f-goal').value)||null};
      if(form.id)Object.assign(S.tasks.find(x=>x.id===form.id),data);else S.tasks.push(Object.assign({id:nid(),done:false},data));
      save();closeSheet();break;}
    case'savetxn':{const amt=num($('f-amt').value);if(!(amt>0)){err('Введи сумму больше нуля');$('f-amt').focus();return;}
      const data={type:form.type,amount:amt,cat:form.cat,note:$('f-note').value.trim(),date:$('f-tdate').value||tKey(),clientId:Number($('f-tclient').value)||null};
      if(form.id)Object.assign(S.txns.find(x=>x.id===form.id),data);else S.txns.push(Object.assign({id:nid()},data));
      save();closeSheet();break;}
    case'saveclient':{const name=$('f-name').value.trim();if(!name){err('Напиши имя клиента');return;}
      const data={name,phone:$('f-phone').value.trim(),address:$('f-addr').value.trim(),note:$('f-cnote').value.trim()};
      let c;if(form.id){c=client(form.id);Object.assign(c,data);}else{c=Object.assign({id:nid()},data);S.clients.push(c);}
      save();render();clientCard(c);return;}
    case'savedebt':{const amt=num($('f-amt').value);if(!(amt>0)){err('Введи сумму');return;}
      const data={amount:amt,clientId:Number($('f-dclient').value)||null,due:$('f-due').value||key(addDays(today(),3)),note:$('f-dnote').value.trim()};
      if(form.id)Object.assign(S.debts.find(x=>x.id===form.id),data);else S.debts.push(Object.assign({id:nid(),paid:false},data));
      save();closeSheet();break;}
    case'savehabit':{const title=$('f-htitle').value.trim();if(!title){err('Напиши привычку');return;}
      if(form.id)Object.assign(S.habits.find(x=>x.id===form.id),{title,color:form.color});else S.habits.push({id:nid(),title,color:form.color,log:[]});
      save();closeSheet();break;}
    case'savegoal':{const title=$('f-gtitle').value.trim(),target=num($('f-gtarget').value);if(!title||!(target>0)){err('Укажи название и число');return;}
      const data={title,target,unit:$('f-gunit').value,deadline:$('f-gdl').value||key(addDays(today(),90))};
      if(form.id)Object.assign(S.goals.find(x=>x.id===form.id),data);else S.goals.push(Object.assign({id:nid(),progress:0},data));
      save();closeSheet();break;}
    case'del':{const k=form.kind,fid=form.id;
      if(k==='task')S.tasks=S.tasks.filter(x=>x.id!==fid);
      else if(k==='txn')S.txns=S.txns.filter(x=>x.id!==fid);
      else if(k==='client'){S.clients=S.clients.filter(x=>x.id!==fid);S.tasks.forEach(t=>{if(t.clientId===fid)t.clientId=null;});}
      else if(k==='debt')S.debts=S.debts.filter(x=>x.id!==fid);
      else if(k==='habit')S.habits=S.habits.filter(x=>x.id!==fid);
      else if(k==='goal'){S.goals=S.goals.filter(x=>x.id!==fid);S.tasks.forEach(t=>{if(t.goalId===fid)t.goalId=null;});}
      save();closeSheet();break;}
    case'backup':{const txt=JSON.stringify(S),ok=()=>{$('f-ok').textContent='Скопировано. Вставь в заметки или отправь себе в Telegram.';},
      fail=()=>{const t=$('f-bk');t.hidden=false;t.value=txt;t.select();$('f-ok').textContent='Выдели текст ниже и скопируй вручную.';};
      try{navigator.clipboard.writeText(txt).then(ok,fail);}catch(_){fail();}return;}
    case'restoreopen':{const t=$('f-bk');t.hidden=false;t.value='';t.focus();$('f-bkbtn').hidden=false;$('f-ok').textContent='';return;}
    case'restore':{try{const d=JSON.parse($('f-bk').value);if(!d||d.v!==2||!Array.isArray(d.tasks))throw 0;S=d;save();closeSheet();break;}catch(_){$('f-ok').style.color='var(--red)';$('f-ok').textContent='Это не похоже на копию Discipline. Проверь, что вставил текст целиком.';return;}}
    case'reset':S=sample();if(PLACE.name!=='Москва')S.place=PLACE;save();closeSheet();break;
    case'wipe':S={v:2,clients:[],tasks:[],txns:[],debts:[],habits:[],goals:[],prayed:{},focus:{},notify:{fajr:1,dhuhr:1,asr:1,maghrib:1,isha:1,sunrise:0},nid:1000,place:S.place};save();closeSheet();animRings=true;break;
    case'gps':{gpsMsg='Определяю место…';render();
      const fail=m=>{gpsMsg=m;render();};
      try{navigator.geolocation.getCurrentPosition(pos=>{PLACE={name:'Моё место · '+pos.coords.latitude.toFixed(2)+', '+pos.coords.longitude.toFixed(2),lat:pos.coords.latitude,lng:pos.coords.longitude};S.place=PLACE;Object.keys(ptCache).forEach(k=>delete ptCache[k]);gpsMsg='Готово: время намаза посчитано для твоего места.';save();render();},
        ()=>fail('Не получилось определить место. Разреши доступ к геопозиции в настройках Safari или открой приложение с экрана «Домой».'),{timeout:15000,maximumAge:3600000});}
      catch(_){fail('Геопозиция недоступна в этом окне.');}
      return;}
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();render();}});
setInterval(()=>{if(!$('sheet').classList.contains('on'))render();},60000);
render();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
